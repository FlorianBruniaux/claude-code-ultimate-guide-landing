name: Link Check

on:
  schedule:
    # Run on the 1st of each month at 08:00 UTC
    - cron: "0 8 1 * *"
  # Also run after each deploy
  workflow_run:
    workflows: ["Deploy Astro site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    # Only run post-deploy check if the deploy succeeded
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
      - name: Check all sitemap pages and interactive link datasets
        id: links
        continue-on-error: true
        run: |
          python3 scripts/check-links.py --site https://cc.bruniaux.com --external --report link-check
      - name: Preserve the full result, including unverified destinations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check
          path: link-check.*
      - name: Report an incomplete crawl
        if: steps.links.outcome == 'failure'
        run: |
          if [ ! -f link-check.md ]; then
            echo 'Link inventory could not complete. Inspect the workflow logs; this is not a successful check.' > link-check.md
          fi

      - name: Find existing broken-links issue
        id: find-issue
        if: steps.links.outcome == 'failure'
        run: |
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "broken-links" --state open --json number --jq '.[0].number // ""')
          echo "issue-number=$ISSUE" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update issue on broken links
        if: steps.links.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          issue-number: ${{ steps.find-issue.outputs.issue-number }}
          title: "Link check findings on cc.bruniaux.com"
          content-filepath: ./link-check.md
          labels: |
            bug
            broken-links

      - name: Fail when broken links or unverified checks were detected
        if: steps.links.outcome == 'failure'
        run: exit 1
