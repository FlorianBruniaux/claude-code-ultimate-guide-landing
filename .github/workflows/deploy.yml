name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: ["main"]
  # The build clones the guide repository below, so a scheduled run picks up
  # guide-only changes without a cross-repository token. It replaces the guide's
  # trigger-landing-deploy workflow, which broke silently when its token expired.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clone guide repo
        run: git clone --depth 1 https://github.com/FlorianBruniaux/claude-code-ultimate-guide.git ../claude-code-ultimate-guide

      - name: Check AgentSec feed synchronization
        run: pnpm check:agentsec-feed

      - name: Run tests
        run: pnpm test && pnpm test:links

      - name: Compute guide stats
        run: |
          STARS=$(curl -s https://api.github.com/repos/FlorianBruniaux/claude-code-ultimate-guide | jq .stargazers_count)
          LINES=$(wc -l < ../claude-code-ultimate-guide/guide/ultimate-guide.md)
          echo "GUIDE_STARS=$STARS" >> "$GITHUB_ENV"
          echo "GUIDE_LINES=$LINES" >> "$GITHUB_ENV"
          echo "Stars: $STARS | Lines: $LINES"

      - name: Prepare guide content
        run: node scripts/prepare-guide-content.mjs
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

      - name: Build diagrams data
        run: node scripts/build-diagrams-data.mjs
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

      - name: Build search indexes
        run: node scripts/build-guide-index.mjs && node scripts/build-guide-content-index.mjs

      - name: Build interactive terminal data
        run: pnpm build:terminal-fs

      - name: Build Astro site
        run: pnpm astro build
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

      - name: Check all built internal and repository links
        run: pnpm check:links

      - name: Check built SEO contracts
        run: pnpm check:built-seo

      - name: Check public pages for workstation paths
        run: python3 ../claude-code-ultimate-guide/scripts/check-public-paths.py --dist dist

      - name: Test asset carry-over
        run: node scripts/test-carry-over-assets.mjs

      # GitHub Pages replaces the whole site on deploy and caches HTML for 10 minutes,
      # so a cached page can request a stylesheet this build renamed (404, unstyled page).
      # Serve the hashed /_astro/ files of the last 3 days of builds next to the new ones.
      - name: Restore assets from earlier builds
        uses: actions/cache/restore@v4
        with:
          path: .astro-assets-carry
          key: astro-assets-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: astro-assets-

      - name: Carry over assets from earlier builds
        run: node scripts/carry-over-assets.mjs dist/_astro .astro-assets-carry 3
        env:
          CARRY_OVER_RESTORED_LIST: carried-assets.txt

      - name: Save assets for the next build
        uses: actions/cache/save@v4
        with:
          path: .astro-assets-carry
          key: astro-assets-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload carried asset list
        uses: actions/upload-artifact@v4
        with:
          name: carried-assets
          path: carried-assets.txt
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download carried asset list
        uses: actions/download-artifact@v4
        with:
          name: carried-assets

      - name: Check deployed and carried-over assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: >-
          node scripts/check-deployed-assets.mjs "$PAGE_URL"
          --carried carried-assets.txt
          / /token-savings/ /finops/ /context-engineering/ /guide/ /releases/

  vercel-preview:
    needs: [build, deploy]
    if: vars.VERCEL_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_c7adrP3tPk90dBJkKsc4Kzmv
      VERCEL_PROJECT_ID: prj_dBZoSMSg9jawAiK3COtfHTbqjN6E
    steps:
      - name: Require Vercel credentials
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN' >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-artifact

      - name: Extract Pages site
        run: |
          mkdir dist
          tar -xf pages-artifact/artifact.tar -C dist

      - name: Package Vercel Build Output API v3
        run: |
          node scripts/test-package-vercel-output.mjs
          node scripts/package-vercel-output.mjs dist .vercel/output

      - name: Deploy Vercel preview
        run: |
          npm install --global vercel@60.0.0
          vercel deploy --prebuilt --target preview --yes --token "$VERCEL_TOKEN"
